---
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # x86 and native ARM: farvardin is meant for ARM boards.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  test-32bit:
    # 386 binaries run natively on x86_64 runners; this catches the
    # int/uint32 overflow and 64-bit alignment bugs that 32-bit ARM and
    # MIPS boards would hit.
    name: test (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test ./...
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"

  cross:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: mipsle, gomips: softfloat }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o farvardin ./cmd/farvardin
          size=$(stat -c %s farvardin)
          echo "| ${GOOS}/${GOARCH}${GOARM:+v$GOARM} | $((size / 1024 / 1024)) MiB |" >> "$GITHUB_STEP_SUMMARY"

  goreleaser:
    # Proves the release config before anyone tags: every archive and
    # package is built (images are left to the release workflow).
    name: goreleaser snapshot
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=docker,publish
      - name: artifacts
        run: ls -la dist/*.tar.gz dist/*.deb dist/*.ipk | awk '{print "| " $9 " | " int($5/1024) " KiB |"}' >> "$GITHUB_STEP_SUMMARY"
