# farvardin configuration. Every key can also be set from the environment:
# FARVARDIN_<SECTION>__<KEY>, for example FARVARDIN_SERVER__LISTEN=:8000.

[server]
listen = "127.0.0.1:8000"
# Mount the DAV tree below a path when a reverse proxy serves it there.
prefix = ""
# Read-only browser UI at /ui/.
ui = true
# Prometheus metrics at /metrics (not behind auth; keep the listener private).
metrics = true
# Serve /metrics on its own address instead, e.g. "127.0.0.1:8001".
metrics_listen = ""

[store]
# Same layout as Xandikos: <root>/<principal>/{contacts,calendars}/<name>/
# Each collection is a git repository. Point this at an existing Xandikos
# store to serve it as it is.
root = "/var/lib/farvardin"
principal = "user"
author_name = "farvardin"
author_email = "farvardin@localhost"
# Create the principal, an address book and a calendar if they are missing.
init = true

[auth]
# "none": a reverse proxy in front authenticates (for example nginx basic auth).
# "basic": the users below, with bcrypt hashes from `farvardin hash-password`.
# "header": trust the user name a proxy sets in `header`.
mode = "none"
realm = "farvardin"
header = "X-Remote-User"

# [auth.users]
# parham = "$2a$10$..."

[contacts]
max_resource_size = 10485760
# Scale photos whose longer side is larger than this; 0 turns it off.
photo_max_size = 720
# Keep the stored photo when a client sends a thumbnail of it.
photo_guard = true
# Keep the stored photo bytes when a client re-encodes the same picture.
photo_stabilize = true
# The longest side that counts as a thumbnail for photo_guard.
thumbnail_size = 128
photo_quality = 85

[calendars]
# A read-only calendar of birthdays and anniversaries from the address book.
birthdays = true
# Remind this many days before; 0 for no reminder.
birthday_alarm_days = 0
birthday_color = "#FF2D55"
# Published as calendar-user-address-set, e.g. "mailto:me@example.com".
user_address = ""

[push]
# WebDAV-Push (draft-bitfire-webdav-push): DAVx5 gets changes at once
# instead of polling. The VAPID key is <state_dir>/vapid/private.pem and is
# created on first start. With a Xandikos store, point state_dir at
# Xandikos's --state-dir: the phones' subscriptions and key carry over.
enabled = false
state_dir = "/var/lib/farvardin/state"
subject = "mailto:farvardin@localhost"

[ui]
# "proxy": /ui/ is guarded like the DAV tree ([auth], or a proxy in front).
# "jwt": farvardin's own login page; signed session cookie scoped to /ui.
auth = "proxy"
session_ttl = "168h"
# The session signing key; created (mode 0600) when missing.
secret_file = "/var/lib/farvardin/ui-session.key"
# Only turn this off to test over plain HTTP.
secure_cookie = true

# [ui.users]
# parham = "$2a$10$..."   # farvardin hash-password

[performance]
# Defaults suit a Raspberry Pi 4. Measured on a 988-card, 32 MB address
# book, a full first sync peaks at ~167 MiB with these defaults and at
# ~87 MiB with the small-board values in the comments.
memory_limit_mb = 0        # small board: 64 (Go's soft limit, like GOMEMLIMIT)
object_cache_mb = 8        # go-git's cache per collection; small board: 2
parse_cache_entries = 4096 # slim cards, ~2 KB each
thumbnail_cache_mb = 16    # small board: 4
max_image_pixels = 16000000
warm = true                # build the history index and avatars in the background
warm_delay = "20s"
warm_pause = "0s"          # single-core board: "20ms", keeps a core for requests
max_multiget_hrefs = 2000

[log]
level = "info"   # debug, info, warn, error
format = "text"  # text or json
