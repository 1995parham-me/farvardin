# GoReleaser: binaries, packages and container images for every release
# tag (v*). Built for small devices first: static (CGO off), stripped,
# and for the ARM, RISC-V and MIPS boards farvardin is meant to run on.
version: 2

project_name: farvardin

before:
  hooks:
    - go mod tidy

builds:
  - id: farvardin
    main: ./cmd/farvardin
    binary: farvardin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
      - mipsle
    goarm:
      - "6"
      - "7"
    gomips:
      - softfloat
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: riscv64 }
      - { goos: darwin, goarch: mipsle }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: riscv64 }
      - { goos: freebsd, goarch: mipsle }

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}
    files:
      - README.md
      - LICENSE
      - configs/config.example.toml
      - deployments/systemd/farvardin.service

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

nfpms:
  - id: packages
    package_name: farvardin
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}
    vendor: 1995parham-me
    homepage: https://github.com/1995parham-me/farvardin
    maintainer: Parham Alvani <parham.alvani@gmail.com>
    description: |-
      CardDAV and CalDAV server that keeps contacts and calendars in git,
      compatible with the Xandikos store layout, with WebDAV-Push and a web UI.
    section: net
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux
      - ipk
    bindir: /usr/bin
    contents:
      - src: configs/config.example.toml
        dst: /etc/farvardin/config.example.toml
        type: config
      - src: deployments/systemd/farvardin.service
        dst: /usr/lib/systemd/system/farvardin.service

dockers:
  - id: farvardin-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-amd64"
      - "ghcr.io/1995parham-me/farvardin:latest-amd64"
    use: buildx
    dockerfile: build/package/Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/1995parham-me/farvardin"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=CardDAV and CalDAV server backed by git"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    extra_files:
      - configs/config.example.toml
  - id: farvardin-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-arm64"
      - "ghcr.io/1995parham-me/farvardin:latest-arm64"
    use: buildx
    dockerfile: build/package/Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/1995parham-me/farvardin"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    extra_files:
      - configs/config.example.toml
  - id: farvardin-armv7
    goos: linux
    goarch: arm
    goarm: "7"
    image_templates:
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-armv7"
      - "ghcr.io/1995parham-me/farvardin:latest-armv7"
    use: buildx
    dockerfile: build/package/Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.source=https://github.com/1995parham-me/farvardin"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    extra_files:
      - configs/config.example.toml

docker_manifests:
  - name_template: "ghcr.io/1995parham-me/farvardin:{{ .Version }}"
    image_templates:
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-amd64"
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-arm64"
      - "ghcr.io/1995parham-me/farvardin:{{ .Version }}-armv7"
  - name_template: "ghcr.io/1995parham-me/farvardin:latest"
    image_templates:
      - "ghcr.io/1995parham-me/farvardin:latest-amd64"
      - "ghcr.io/1995parham-me/farvardin:latest-arm64"
      - "ghcr.io/1995parham-me/farvardin:latest-armv7"

release:
  github:
    owner: 1995parham-me
    name: farvardin
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
